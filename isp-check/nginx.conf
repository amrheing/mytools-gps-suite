server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json text/xml text/plain;

    # Security headers. Repeated in every location that sets its own add_header,
    # because nginx drops inherited add_header directives in that case.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Static download page: missing files are a real 404, not the start page
    # (otherwise a wrong download link silently saves HTML as .zip/.pyz).
    location / {
        try_files $uri $uri/ =404;
    }

    location /download/ {
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache";
        types {
            application/octet-stream pyz;
            text/plain sha256;
        }
    }

    # Cache static assets, without access log noise
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        access_log off;
    }
}
