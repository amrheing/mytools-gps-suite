<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Your Password – myTools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .logo {
            text-align: center;
            margin-bottom: 35px;
        }
        .logo i {
            font-size: 2.8rem;
            color: #9b59b6;
            margin-bottom: 12px;
            display: block;
        }
        .logo h1 {
            color: white;
            font-size: 1.5rem;
            font-weight: 600;
        }
        .logo p {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            margin-top: 6px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.35);
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            transition: border-color 0.2s, background 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: rgba(155,89,182,0.6);
            background: rgba(255,255,255,0.12);
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.88rem;
            margin-bottom: 20px;
            display: none;
        }
        .alert.show { display: block; }
        .alert-error { background: rgba(231,76,60,0.2); border: 1px solid rgba(231,76,60,0.4); color: #e74c3c; }
        .alert-success { background: rgba(46,204,113,0.2); border: 1px solid rgba(46,204,113,0.4); color: #2ecc71; }
        .hint {
            color: rgba(255,255,255,0.3);
            font-size: 0.78rem;
            margin-top: 6px;
        }
        #success-state { display: none; text-align: center; }
        #success-state i { font-size: 3rem; color: #2ecc71; margin-bottom: 16px; display: block; }
        #success-state h2 { color: white; margin-bottom: 10px; }
        #success-state p { color: rgba(255,255,255,0.6); font-size: 0.9rem; margin-bottom: 24px; }
        #success-state a {
            display: inline-block;
            padding: 12px 28px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
        }
        #error-state { display: none; text-align: center; }
        #error-state i { font-size: 3rem; color: #e74c3c; margin-bottom: 16px; display: block; }
        #error-state h2 { color: white; margin-bottom: 10px; }
        #error-state p { color: rgba(255,255,255,0.6); font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <i class="fas fa-envelope-open-text"></i>
        <h1>Set Your Password</h1>
        <p id="invite-subtitle">You have been invited to myTools</p>
    </div>

    <div id="loading-state" style="text-align:center; color:rgba(255,255,255,0.4); padding:20px 0;">
        <i class="fas fa-spinner fa-spin"></i> Validating invitation…
    </div>

    <div id="form-state" style="display:none;">
        <div id="form-alert" class="alert"></div>
        <div class="form-group">
            <label>New Password</label>
            <div class="input-wrap">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="Choose a password" autocomplete="new-password">
            </div>
            <div class="hint">Minimum 8 characters</div>
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <div class="input-wrap">
                <i class="fas fa-lock"></i>
                <input type="password" id="password-confirm" placeholder="Repeat your password" autocomplete="new-password">
            </div>
        </div>
        <button class="btn btn-primary" id="submit-btn" onclick="submitPassword()">
            <i class="fas fa-key"></i> Set Password &amp; Activate Account
        </button>
    </div>

    <div id="success-state">
        <i class="fas fa-check-circle"></i>
        <h2>Password Set!</h2>
        <p>Your account <strong id="success-username"></strong> is now active.</p>
        <a href="./login.html"><i class="fas fa-sign-in-alt"></i> Go to Login</a>
    </div>

    <div id="error-state">
        <i class="fas fa-exclamation-circle"></i>
        <h2>Invalid Invitation</h2>
        <p id="error-message">This invitation link is invalid or has expired.</p>
    </div>
</div>

<script>
    // Extract token from URL path: /route-tracker/invite/TOKEN
    const pathParts = window.location.pathname.split('/');
    const token = pathParts[pathParts.length - 1];

    function showState(name) {
        ['loading-state', 'form-state', 'success-state', 'error-state'].forEach(id => {
            document.getElementById(id).style.display = id === name ? '' : 'none';
        });
    }

    // Validate the token exists by attempting a lightweight check
    // We don't expose a GET validation endpoint — just show the form and let the POST fail
    window.addEventListener('DOMContentLoaded', () => {
        if (!token || token.length < 10) {
            document.getElementById('error-message').textContent = 'This invitation link is invalid.';
            showState('error-state');
        } else {
            showState('form-state');
            document.getElementById('password').focus();
        }
    });

    document.getElementById('password-confirm').addEventListener('keydown', e => {
        if (e.key === 'Enter') submitPassword();
    });

    async function submitPassword() {
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('password-confirm').value;
        const alertDiv = document.getElementById('form-alert');
        const btn = document.getElementById('submit-btn');

        alertDiv.className = 'alert';

        if (password.length < 8) {
            alertDiv.textContent = 'Password must be at least 8 characters.';
            alertDiv.className = 'alert alert-error show';
            return;
        }
        if (password !== confirm) {
            alertDiv.textContent = 'Passwords do not match.';
            alertDiv.className = 'alert alert-error show';
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Setting password…';

        try {
            // Determine the base path for the API call (handles nginx sub-path proxying)
            const basePath = window.location.pathname.split('/invite/')[0];
            const res = await fetch(`${basePath}/api/invite/${token}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            const data = await res.json();
            if (res.ok) {
                document.getElementById('success-username').textContent = data.username;
                showState('success-state');
            } else {
                alertDiv.textContent = data.error || 'Failed to set password. Please try again.';
                alertDiv.className = 'alert alert-error show';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-key"></i> Set Password &amp; Activate Account';
                if (res.status === 410) {
                    // Token expired or used — hide form, show error
                    document.getElementById('error-message').textContent = data.error;
                    showState('error-state');
                }
            }
        } catch (err) {
            alertDiv.textContent = 'Network error. Please try again.';
            alertDiv.className = 'alert alert-error show';
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-key"></i> Set Password &amp; Activate Account';
        }
    }
</script>
</body>
</html>
