server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_types text/css application/javascript application/json text/xml;

    # Security headers
    # Note: nginx only inherits add_header from this level if a location sets none of its own,
    # so locations with own headers include the same snippet.
    include /etc/nginx/conf.d/security-headers.inc;

    # Main location
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Scripts and styles: file names carry no version, so browsers must revalidate (ETag)
    # to pick up updates immediately
    location ~* \.(css|js)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    # Images rarely change: cache for a week
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        expires 7d;
        access_log off;
    }
}
