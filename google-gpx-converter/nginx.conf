# Requests per client for the short link resolver (behind the host proxy the client IP is in X-Real-IP)
map $http_x_real_ip $expand_client {
    ""      $binary_remote_addr;
    default $http_x_real_ip;
}
limit_req_zone $expand_client zone=expand:1m rate=30r/m;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Short link resolver: returns the redirect target of a Google short link as text/plain.
    # Only the link ID reaches Google; no client headers or cookies are forwarded.
    location ~ "^/expand/app/([A-Za-z0-9_-]{4,40})$" {
        set $expand_target https://maps.app.goo.gl/$1;
        include /etc/nginx/expand.inc;
    }

    location ~ "^/expand/goo/([A-Za-z0-9_-]{4,40})$" {
        set $expand_target https://goo.gl/maps/$1;
        include /etc/nginx/expand.inc;
    }

    location /expand/ {
        return 400;
    }

    location @expanded {
        default_type text/plain;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        return 200 $upstream_http_location;
    }

    location @expand_failed {
        default_type text/plain;
        add_header Cache-Control no-store always;
        return 404 "not found";
    }
}
