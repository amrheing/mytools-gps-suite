name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Install Python dependencies
      run: |
        pip install -r extract-gpx-parts/web/requirements.txt
        pip install pytest coverage

    - name: Run Python tests
      run: |
        cd extract-gpx-parts
        python -m pytest --cov=. --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./extract-gpx-parts/coverage.xml
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install and test Route Tracker
      run: |
        cd route-tracker
        npm install
        
        # Create temporary data directory
        mkdir -p /tmp/route-tracker-data/{routes,devices,sessions}
        
        # Start server in background
        DATA_DIR=/tmp/route-tracker-data PORT=3000 node server.js &
        SERVER_PID=$!
        
        # Wait for server to be ready (with better error handling)
        echo "Waiting for Route Tracker server to start..."
        for i in $(seq 1 15); do
          if curl -sf http://localhost:3000/api/health >/dev/null 2>&1; then
            echo "✅ Route Tracker server is healthy"
            break
          fi
          if [ $i -eq 15 ]; then
            echo "❌ Route Tracker server failed to start"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          sleep 2
        done
        
        # Test health endpoint response
        HEALTH_RESPONSE=$(curl -s http://localhost:3000/api/health)
        echo "Health check response: $HEALTH_RESPONSE"
        
        # Test basic API endpoints
        curl -sf http://localhost:3000/api/routes >/dev/null || echo "⚠️ Routes endpoint not accessible (expected for first run)"
        
        # Clean shutdown
        kill $SERVER_PID 2>/dev/null || true
        wait $SERVER_PID 2>/dev/null || true
        
        # Cleanup
        rm -rf /tmp/route-tracker-data

    - name: Test JavaScript components
      run: |
        cd google-gpx-converter
        npm install --global @web/test-runner
        # Add JS tests when available

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Google GPX Converter
      run: |
        cd google-gpx-converter
        docker build -t google-gpx-converter:test .
    
    - name: Build Extract GPX Parts
      run: |
        cd extract-gpx-parts
        docker build -t extract-gpx-parts:test .
    
    - name: Build Route Tracker
      run: |
        cd route-tracker
        docker build -t route-tracker:test .

    - name: Test Docker containers
      run: |
        docker compose -f docker-compose.yml config
        docker compose -f docker-compose.yml up -d --build
        sleep 30
        
        # Test Google GPX Converter
        curl -f http://localhost:6010 || exit 1
        
        # Test Extract GPX Parts
        curl -f http://localhost:6020 || exit 1
        
        # Test Route Tracker
        curl -f http://localhost:6050/api/health || exit 1
        
        docker compose down
    
    - name: Run security scan
      uses: aquasec/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  deploy:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Docker Hub
      if: ${{ secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN }}
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ secrets.DOCKERHUB_USERNAME }}/google-gpx-converter
          ${{ secrets.DOCKERHUB_USERNAME }}/extract-gpx-parts
          ${{ secrets.DOCKERHUB_USERNAME }}/route-tracker
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push Google GPX Converter
      if: ${{ secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN }}
      uses: docker/build-push-action@v5
      with:
        context: ./google-gpx-converter
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/google-gpx-converter:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push Extract GPX Parts
      if: ${{ secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN }}
      uses: docker/build-push-action@v5
      with:
        context: ./extract-gpx-parts
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/extract-gpx-parts:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Build and push Route Tracker
      if: ${{ secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN }}
      uses: docker/build-push-action@v5
      with:
        context: ./route-tracker
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/route-tracker:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Skip Docker Push (Missing Credentials)
      if: ${{ !secrets.DOCKERHUB_USERNAME || !secrets.DOCKERHUB_TOKEN }}
      run: |
        echo "⚠️ Skipping Docker Hub deployment - credentials not configured"
        echo "To enable deployment, set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets"

  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: [test, build]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Create deployment package
      run: |
        tar -czf mytools-gps-suite-${{ github.event.release.tag_name }}.tar.gz \
          --exclude='.git' \
          --exclude='extract-gpx-parts/data/uploads/*' \
          --exclude='extract-gpx-parts/data/processed/*' \
          --exclude='route-tracker/data/routes/*' \
          --exclude='route-tracker/data/devices/*' \
          --exclude='route-tracker/data/tokens.json' \
          --exclude='route-tracker/data/users.json' \
          --exclude='route-tracker/node_modules' \
          --exclude='__pycache__' \
          --exclude='*.pyc' \
          .
    
    - name: Upload release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./mytools-gps-suite-${{ github.event.release.tag_name }}.tar.gz
        asset_name: mytools-gps-suite-${{ github.event.release.tag_name }}.tar.gz
        asset_content_type: application/gzip